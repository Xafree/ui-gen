<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Synthetic facts</title>
<style>
  :root { --syn-primary: rgb(10, 20, 30); --syn-border: rgb(1, 2, 3); }
  body { margin: 20px; font-family: Arial, sans-serif; }
  #root {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 4px 12px;
    justify-content: center;
    width: 240px;
  }
  .btn {
    background-color: var(--syn-primary);
    border-top-color: var(--syn-border);
  }
  .plain { background-color: rgb(200, 0, 0); }
  .spin {
    width: 20px;
    height: 20px;
    background-color: rgb(0, 128, 0);
    animation: spin 2s linear infinite;
  }
  .still { width: 20px; height: 20px; background-color: rgb(0, 0, 200); }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="root" class="card">
  <button class="btn primary" type="button">Bouton</button>
  <div class="plain">Plain</div>
  <div class="spin"></div>
  <div class="still"></div>
</div>
</body>
</html>
